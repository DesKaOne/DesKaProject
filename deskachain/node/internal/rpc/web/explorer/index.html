<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DesKaChain Explorer</title>
  <link rel="stylesheet" href="/explorer-ui/assets/styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <strong>DesKaChain Explorer</strong>
      <span>Public testnet</span>
    </div>
    <nav class="nav" aria-label="Explorer navigation">
      <a href="#/">Dashboard</a>
      <a href="#/blocks">Blocks</a>
      <a href="#/mining">Mining</a>
      <a href="#/stakes">Stakes</a>
      <a href="#/services">Services</a>
    </nav>
    <form id="search-form" class="search" role="search">
      <input id="search-input" name="q" autocomplete="off" placeholder="Height, hash, txid, or address" aria-label="Search explorer">
      <button type="submit">Search</button>
    </form>
  </header>

  <section class="notice" aria-label="Testnet warning">
    <strong>Testnet IDR has no monetary value.</strong>
    <span>Mainnet is not available.</span>
    <span>Explorer is read-only.</span>
  </section>

  <main id="app" class="app" tabindex="-1">
    <section class="panel">
      <h1>Loading explorer...</h1>
    </section>
  </main>

  <footer class="footer">
    Testnet only. No wallet, admin, faucet, staking, mining, or service write actions are exposed here.
  </footer>

  <script src="/explorer-ui/assets/app.js"></script>
</body>
</html>
