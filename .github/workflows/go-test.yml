name: Go tests

on:
  push:
    branches:
      - main
      - phase-5-consensus-hardening
      - phase-8-testnet
  pull_request:
    branches:
      - main
      - phase-8-testnet

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: deskachain/node
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Test
        run: go test ./...
